name: Feature Request
description: Propose an enhancement to OSMP
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement! Please describe the problem you want to solve.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to implement this feature.
        - label: This is aligned with the project roadmap (see ROADMAP.md).
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, links, or other context.
    validations:
      required: false
